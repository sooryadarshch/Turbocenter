<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turboconnect - Global Network System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121216; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header containing only Navigation/Buttons -->
    <header class="flex justify-end items-center px-6 py-4 border-b border-gray-800 text-sm space-x-4">
        <!-- Sign Up Button in Header -->
        <button onclick="openModal()" class="bg-gray-800 hover:bg-gray-700 text-cyan-400 px-3 py-1.5 rounded text-sm font-medium">Sign Up</button>

        <!-- Modal Structure -->
        <div id="signupModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
            <div class="bg-[#1a1a24] p-6 rounded-2xl border border-gray-800 w-80 relative">
                <h3 class="text-lg font-bold text-white mb-4">Create Account</h3>
                <input type="email" placeholder="Email address" class="w-full bg-[#121216] border border-gray-700 rounded p-2 mb-3 text-sm text-white">
                <input type="password" placeholder="Password" class="w-full bg-[#121216] border border-gray-700 rounded p-2 mb-4 text-sm text-white">
                <button onclick="alert('Account created successfully!'); closeModal();" class="w-full bg-cyan-500 text-black font-bold py-2 rounded text-sm">Register</button>
                <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white">✕</button>
            </div>
        </div>

        <script>
            function openModal() { document.getElementById('signupModal').classList.remove('hidden'); }
            function closeModal() { document.getElementById('signupModal').classList.add('hidden'); }
        </script>
    </header>

    <!-- Main Section centered with Title Above the Box -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Big Centered Title Above the Box -->
        <div class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-widest text-cyan-400">TURBOCONNECT</h1>
            <p class="text-xs text-gray-400 mt-1 tracking-wider uppercase">Global Network System </p>
        </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-[#1a1a24] w-full max-w-3xl rounded-2xl p-8 shadow-2xl border border-gray-800 relative">
            
            <!-- Top Action / ID -->
            <div class="flex justify-between items-center text-xs text-gray-400 mb-6">
                <div>Share: <span class="text-cyan-400 cursor-pointer">🔗 ✖ 📘</span></div>
                <div>Result ID: <span id="resultId" class="text-gray-300">--</span></div>
            </div>

            <!-- Speed Metrics Grid -->
            <div class="grid grid-cols-2 gap-8 text-center my-6">
                <!-- Download -->
                <div class="border-r border-gray-800 pr-4">
                    <div class="text-xs uppercase text-cyan-400 tracking-wider font-semibold mb-1">↓ Download Mbps</div>
                    <div id="downloadSpeed" class="text-5xl font-light text-white tracking-tight">--</div>
                </div>
                <!-- Upload -->
                <div>
                    <div class="text-xs uppercase text-purple-400 tracking-wider font-semibold mb-1">↑ Upload Mbps</div>
                    <div id="uploadSpeed" class="text-5xl font-light text-white tracking-tight">--</div>
                </div>
            </div>

            <!-- Ping / Latency Row -->
            <div class="flex justify-center space-x-8 text-xs text-gray-400 mb-8 pb-6 border-b border-gray-800">
                <div>Ping ms: <span id="pingVal" class="text-white font-medium">--</span></div>
                <div>Unloaded: <span id="unloadedVal" class="text-white font-medium">--</span></div>
                <div>Loaded: <span id="loadedVal" class="text-white font-medium">--</span></div>
            </div>

            <!-- Center Go Button & Info Panel Layout -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                
                <!-- Go Button -->
                <div class="flex justify-center md:justify-start">
                    <button id="goBtn" onclick="startTest()" class="w-32 h-32 rounded-full border-4 border-cyan-400 bg-[#121216] hover:bg-cyan-500 hover:text-black text-cyan-400 font-bold text-2xl tracking-widest shadow-[0_0_30px_rgba(6,182,212,0.3)] transition-all duration-300 flex items-center justify-center">
                        GO
                    </button>
                </div>

                <!-- Network Details -->
                <div class="md:col-span-2 space-y-3 text-sm">
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">⚡</span>
                        <div>
                            <div class="text-xs text-gray-500">Connections</div>
                            <div id="connType" class="font-medium">Multi</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">🌐</span>
                        <div>
                            <div class="text-xs text-gray-500">ISP</div>
                            <div id="ispName" class="font-medium">Detecting network...</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">📍</span>
                        <div>
                            <div class="text-xs text-gray-500">Server Location</div>
                            <div class="font-medium flex items-center space-x-2">
                                <span id="serverName">Auto-selected</span>
                                <span class="text-cyan-400 text-xs cursor-pointer hover:underline">Change Server</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- JavaScript for Test Logic & Simulation -->
    <script>
        // Fetch basic IP info on load
        window.onload = async function() {
            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                document.getElementById('ispName').innerText = `${data.org || data.asn} (${data.ip})`;
                document.getElementById('serverName').innerText = `${data.city}, ${data.country_name}`;
            } catch (e) {
                document.getElementById('ispName').innerText = "Local Network";
                document.getElementById('serverName').innerText = "Default Node";
            }
        };

        function startTest() {
            const goBtn = document.getElementById('goBtn');
            const downloadElem = document.getElementById('downloadSpeed');
            const uploadElem = document.getElementById('uploadSpeed');
            const pingElem = document.getElementById('pingVal');
            const unloadedElem = document.getElementById('unloadedVal');
            const loadedElem = document.getElementById('loadedVal');
            const resultId = document.getElementById('resultId');

            goBtn.disabled = true;
            goBtn.innerText = "LOADING";
            goBtn.classList.add('opacity-50', 'animate-pulse');
            resultId.innerText = Math.floor(Math.random() * 8999999999 + 1000000000);

            // Simulate Ping first
            let ping = Math.floor(Math.random() * 30) + 10;
            pingElem.innerText = ping;
            unloadedElem.innerText = ping + 2;
            loadedElem.innerText = ping + 15;

            let currentDownload = 0;
            let targetDownload = (Math.random() * 80 + 20).toFixed(2); // Random speed between 20-100 Mbps
            
            // Simulate Download Speed Test
            let downloadInterval = setInterval(() => {
                currentDownload += targetDownload / 20;
                if (currentDownload >= targetDownload) {
                    currentDownload = targetDownload;
                    clearInterval(downloadInterval);
                    startUploadTest(targetDownload);
                }
                downloadElem.innerText = currentDownload.toFixed(2);
            }, 100);

            function startUploadTest(finalDownload) {
                let currentUpload = 0;
                let targetUpload = (finalDownload * (Math.random() * 0.3 + 0.6)).toFixed(2); // Upload usually slightly lower

                let uploadInterval = setInterval(() => {
                    currentUpload += targetUpload / 20;
                    if (currentUpload >= targetUpload) {
                        currentUpload = targetUpload;
                        clearInterval(uploadInterval);
                        
                        // Reset button state
                        goBtn.disabled = false;
                        goBtn.innerText = "GO";
                        goBtn.classList.remove('opacity-50', 'animate-pulse');
                    }
                    uploadElem.innerText = currentUpload.toFixed(2);
                }, 100);
            }
        }
    </script>
</body>
</html>
