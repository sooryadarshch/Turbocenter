<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboCenter - Global Network System </title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121216;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center px-6 py-4 border-b border-gray-800 text-sm">
        <div class="flex items-center space-x-6">
            <span class="font-bold tracking-wider text-lg text-cyan-400">TURBOCENTER</span>
            <span class="cursor-pointer hover:text-white text-gray-400">Menu ▾</span>
            <span class="cursor-pointer hover:text-white text-gray-400">English ▾</span>
        </div>
        <div class="flex items-center space-x-4">
            <button class="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-4 py-1.5 rounded-full text-sm transition">Download ▾</button>
            <button class="border border-gray-700 hover:border-gray-500 px-4 py-1.5 rounded-full text-sm transition">Sign Up</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-[#1a1a24] w-full max-w-3xl rounded-2xl p-8 shadow-2xl border border-gray-800 relative">
            
            <!-- Top Action / ID -->
            <div class="flex justify-between items-center text-xs text-gray-400 mb-6">
                <div>Share: <span class="text-cyan-400 cursor-pointer">🔗 ✖ 📘</span></div>
                <div>Result ID: <span id="resultId" class="text-gray-300">--</span></div>
            </div>

            <!-- Speed Metrics Grid -->
            <div class="grid grid-cols-2 gap-8 text-center my-6">
                <!-- Download -->
                <div class="border-r border-gray-800 pr-4">
                    <div class="text-xs uppercase text-cyan-400 tracking-wider font-semibold mb-1">↓ Download Mbps</div>
                    <div id="downloadSpeed" class="text-5xl font-light text-white tracking-tight">--</div>
                </div>
                <!-- Upload -->
                <div>
                    <div class="text-xs uppercase text-purple-400 tracking-wider font-semibold mb-1">↑ Upload Mbps</div>
                    <div id="uploadSpeed" class="text-5xl font-light text-white tracking-tight">--</div>
                </div>
            </div>

            <!-- Ping / Latency Row -->
            <div class="flex justify-center space-x-8 text-xs text-gray-400 mb-8 pb-6 border-b border-gray-800">
                <div>Ping ms: <span id="pingVal" class="text-white font-medium">--</span></div>
                <div>Unloaded: <span id="unloadedVal" class="text-white font-medium">--</span></div>
                <div>Loaded: <span id="loadedVal" class="text-white font-medium">--</span></div>
            </div>

            <!-- Center Go Button & Info Panel Layout -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                
                <!-- Go Button -->
                <div class="flex justify-center md:justify-start">
                    <button id="goBtn" onclick="startTest()" class="w-32 h-32 rounded-full border-4 border-cyan-400 bg-[#121216] hover:bg-cyan-500 hover:text-black text-cyan-400 font-bold text-2xl tracking-widest shadow-[0_0_30px_rgba(6,182,212,0.3)] transition-all duration-300 flex items-center justify-center">
                        GO
                    </button>
                </div>

                <!-- Network Details -->
                <div class="md:col-span-2 space-y-3 text-sm">
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">⚡</span>
                        <div>
                            <div class="text-xs text-gray-500">Connections</div>
                            <div id="connType" class="font-medium">Multi</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">🌐</span>
                        <div>
                            <div class="text-xs text-gray-500">ISP</div>
                            <div id="ispName" class="font-medium">Detecting network...</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-300">
                        <span class="text-gray-500">📍</span>
                        <div>
                            <div class="text-xs text-gray-500">Server Location</div>
                            <div class="font-medium flex items-center space-x-2">
                                <span id="serverName">Auto-selected</span>
                                <span class="text-cyan-400 text-xs cursor-pointer hover:underline">Change Server</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Feedback Bar -->
            <div class="mt-8 pt-6 border-t border-gray-800 text-center">
                <div class="text-xs text-gray-400 mb-2">HOW DOES YOUR NETWORK AVAILABILITY COMPARE WITH YOUR EXPECTATIONS?</div>
                <div class="flex justify-center space-x-2">
                    <button class="w-10 h-8 bg-gray-800 hover:bg-gray-700 rounded text-xs">1</button>
                    <button class="w-10 h-8 bg-gray-800 hover:bg-gray-700 rounded text-xs">2</button>
                    <button class="w-10 h-8 bg-gray-800 hover:bg-gray-700 rounded text-xs">3</button>
                    <button class="w-10 h-8 bg-gray-800 hover:bg-gray-700 rounded text-xs">4</button>
                    <button class="w-10 h-8 bg-gray-800 hover:bg-gray-700 rounded text-xs">5</button>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript for Test Logic & Backend Integration -->
    <script>
        window.onload = async function() {
            try {
                let response = await fetch('/api/info');
                let data = await response.json();
                document.getElementById('ispName').innerText = `${data.org} (${data.ip})`;
                document.getElementById('serverName').innerText = `${data.city}, ${data.country_name}`;
            } catch (e) {
                document.getElementById('ispName').innerText = "Local Network";
                document.getElementById('serverName').innerText = "Default Node";
            }
        };

        async function startTest() {
            const goBtn = document.getElementById('goBtn');
            const downloadElem = document.getElementById('downloadSpeed');
            const uploadElem = document.getElementById('uploadSpeed');
            const pingElem = document.getElementById('pingVal');
            const unloadedElem = document.getElementById('unloadedVal');
            const loadedElem = document.getElementById('loadedVal');
            const resultId = document.getElementById('resultId');

            goBtn.disabled = true;
            goBtn.innerText = "TESTING";
            goBtn.classList.add('opacity-50', 'animate-pulse');
            resultId.innerText = Math.floor(Math.random() * 8999999999 + 1000000000);

            let ping = Math.floor(Math.random() * 30) + 10;
            pingElem.innerText = ping;
            unloadedElem.innerText = ping + 2;
            loadedElem.innerText = ping + 15;

            // Real Download Speed Test from Backend
            try {
                let startTime = Date.now();
                let response = await fetch('/api/download');
                let blob = await response.blob();
                let endTime = Date.now();
                
                let durationSeconds = (endTime - startTime) / 1000;
                let bitsLoaded = blob.size * 8;
                let speedBps = bitsLoaded / durationSeconds;
                let speedMbps = (speedBps / (1024 * 1024)).toFixed(2);
                
                downloadElem.innerText = speedMbps;
            } catch (err) {
                downloadElem.innerText = "Error";
            }

            // Real Upload Speed Test to Backend
            try {
                let uploadSize = 2 * 1024 * 1024; // 2MB chunk
                let data = new Uint8Array(uploadSize);
                let startTime = Date.now();
                
                await fetch('/api/upload', {
                    method: 'POST',
                    body: data
                });
                
                let endTime = Date.now();
                let durationSeconds = (endTime - startTime) / 1000;
                let bitsUploaded = uploadSize * 8;
                let speedBps = bitsUploaded / durationSeconds;
                let speedMbps = (speedBps / (1024 * 1024)).toFixed(2);
                
                uploadElem.innerText = speedMbps;
            } catch (err) {
                uploadElem.innerText = "Error";
            }

            goBtn.disabled = false;
            goBtn.innerText = "GO";
            goBtn.classList.remove('opacity-50', 'animate-pulse');
        }
    </script>
</body>
</html>
